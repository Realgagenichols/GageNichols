<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 32 32" role="img" aria-label="Atomic age portfolio favicon">
  <!-- Midnight blue rounded square background, matches the site theme-color -->
  <rect width="32" height="32" rx="6" ry="6" fill="#0c1430"/>
  <!-- Tilted orbit (turquoise stroke) — visible even at 16px because it's the largest shape -->
  <ellipse cx="16" cy="16" rx="11" ry="5"
           fill="none"
           stroke="#22d3ee"
           stroke-width="1.6"
           transform="rotate(-30 16 16)"/>
  <!-- Second orbit, opposite tilt, dimmer -->
  <ellipse cx="16" cy="16" rx="11" ry="5"
           fill="none"
           stroke="#f472b6"
           stroke-width="1.4"
           opacity="0.7"
           transform="rotate(35 16 16)"/>
  <!-- Nucleus — gold filled circle with subtle inner highlight -->
  <circle cx="16" cy="16" r="3.6" fill="#fbbf24"/>
  <circle cx="14.8" cy="14.5" r="1.2" fill="#fde68a" opacity="0.8"/>
  <!-- Single electron — coral dot on the first orbit's path -->
  <circle cx="25" cy="13" r="1.6" fill="#ff6b6b"/>
</svg>
