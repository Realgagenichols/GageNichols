<!doctype html>
<html lang="en" data-theme="dark">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="theme-color" content="#0c1430" />
    <meta name="color-scheme" content="dark light" />
    <meta name="description" content="Gage Nichols | Cyber Security Engineer. Cloud security, leadership, compliance." />

    <!--
      Open Graph + Twitter card meta tags MUST be in the static HTML so
      social-media crawlers (LinkedIn, Slack, Discord, iMessage) that don't
      execute JavaScript still produce link-preview cards.
      The runtime SEO component can layer on additional/dynamic tags.
    -->
    <meta property="og:type" content="website" />
    <meta property="og:title" content="Gage Nichols | Cyber Security Engineer" />
    <meta property="og:description" content="Security engineering leader delivering cloud security for 8M+ users. Cloud & security operations, strategic risk management, team leadership." />
    <meta property="og:image" content="./og-image.jpg" />
    <meta property="og:image:alt" content="Atomic-age illustrated portrait of Gage Nichols" />
    <meta property="og:image:width" content="1200" />
    <meta property="og:image:height" content="900" />
    <meta name="twitter:card" content="summary_large_image" />
    <meta name="twitter:title" content="Gage Nichols | Cyber Security Engineer" />
    <meta name="twitter:description" content="Security engineering leader delivering cloud security for 8M+ users." />
    <meta name="twitter:image" content="./og-image.jpg" />

    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Audiowide&family=Lobster+Two:ital,wght@0,400;0,700;1,400&family=Lato:wght@400;700;900&family=Share+Tech+Mono&family=Special+Elite&display=swap"
      rel="stylesheet"
    />
    <title>Gage Nichols | Cyber Security Engineer</title>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.jsx"></script>
  </body>
</html>
