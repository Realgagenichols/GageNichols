<!doctype html>
<html lang="en" data-theme="dark">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="theme-color" content="#0c1430" />
    <meta name="color-scheme" content="dark light" />
    <meta name="description" content="Gage Nichols | Cyber Security Engineer. Cloud security, leadership, compliance." />

    <!--
      Open Graph + Twitter card meta tags MUST be in the static HTML so
      social-media crawlers (LinkedIn, Slack, Discord, iMessage) that don't
      execute JavaScript still produce link-preview cards.
      The runtime SEO component can layer on additional/dynamic tags.
    -->
    <meta property="og:type" content="website" />
    <meta property="og:title" content="Gage Nichols | Cyber Security Engineer" />
    <meta property="og:description" content="Security engineering leader delivering cloud security for 8M+ users. Cloud & security operations, strategic risk management, team leadership." />
    <meta property="og:image" content="./og-image.jpg" />
    <meta property="og:image:alt" content="Atomic-age illustrated portrait of Gage Nichols" />
    <meta property="og:image:width" content="1200" />
    <meta property="og:image:height" content="900" />
    <meta name="twitter:card" content="summary_large_image" />
    <meta name="twitter:title" content="Gage Nichols | Cyber Security Engineer" />
    <meta name="twitter:description" content="Security engineering leader delivering cloud security for 8M+ users." />
    <meta name="twitter:image" content="./og-image.jpg" />

    <!-- Favicon — atom logo SVG, scales perfectly across browser tab sizes -->
    <link rel="icon" href="./favicon.svg" type="image/svg+xml" />
    <link rel="apple-touch-icon" href="./favicon.svg" />

    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Audiowide&family=Lobster+Two:ital,wght@0,400;0,700;1,400&family=Lato:wght@400;700;900&family=Share+Tech+Mono&family=Special+Elite&display=swap"
      rel="stylesheet"
    />
    <title>Gage Nichols | Cyber Security Engineer</title>

    <!--
      JSON-LD Person schema — helps Google show your name, role, and LinkedIn
      in knowledge panels / rich results. Only sources facts already published
      on the site (name, title, location, LinkedIn URL); nothing fabricated.
    -->
    <script type="application/ld+json">
      {
        "@context": "https://schema.org",
        "@type": "Person",
        "name": "Gage Nichols",
        "jobTitle": "Cyber Security Engineer",
        "description": "Security engineering leader delivering enterprise cloud security solutions for 8M+ users while building teams and driving compliance initiatives.",
        "address": {
          "@type": "PostalAddress",
          "addressRegion": "Texas",
          "addressCountry": "US"
        },
        "alumniOf": {
          "@type": "CollegeOrUniversity",
          "name": "The University of Texas at San Antonio"
        },
        "knowsAbout": [
          "Cloud Security",
          "AWS Multi-Account Architecture",
          "Cloud Security Posture Management",
          "Identity and Access Management",
          "Vulnerability Management",
          "Incident Response",
          "Security Automation",
          "Data Loss Prevention",
          "SOC 2",
          "PCI DSS",
          "Security Leadership"
        ],
        "sameAs": [
          "https://www.linkedin.com/in/gagenichols"
        ]
      }
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.jsx"></script>
  </body>
</html>
